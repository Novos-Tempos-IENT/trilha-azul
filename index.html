<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),TOTAL=50,V={U:{dr:-1,dc:0,label:'cima'},D:{dr:1,dc:0,label:'baixo'},L:{dr:0,dc:-1,label:'esquerda'},R:{dr:0,dc:1,label:'direita'}};
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const DIR_COLOR={R:'#e93678',L:'#2fc3ce',U:'#b3d431',D:'#ffa817'},GOAL_COLOR='#ffd84d',DIR_FROM_COLOR=Object.fromEntries(Object.entries(DIR_COLOR).map(([d,c])=>[c,d]));
function makeLevel(n){
 const rand=rng(65219+n*997),rows=n<9?4:n<19?5:n<31?6:7,cols=n<6?5:n<16?6:n<29?7:8,wrap=[6,12,18,24,30,36,42,48].includes(n),start=[rows-1,0],classicLength=Math.min(rows*cols-1,2+Math.floor(n*1.05));
 if(n>=10){
  const coords=[start.slice()],route=[];let r=start[0],c=start[1];
  function add(d){let nr=r+V[d].dr,nc=c+V[d].dc;if(wrap){nr=(nr+rows)%rows;nc=(nc+cols)%cols}else if(nr<0||nc<0||nr>=rows||nc>=cols)return false;const k=nr+','+nc;if(coords.some(q=>q[0]===nr&&q[1]===nc))return false;route.push(d);coords.push([nr,nc]);r=nr;c=nc;return true}
  // Rotas variadas para os níveis 10–22, combinando movimentos verticais e horizontais.
  const patterns=[
   ['R','R','R','U','L','L','U','R','R','U','L'],
   ['U','U','R','R','U','U','R','U','U'],
   ['R','R','U','U','R','R','D','D','R','U','U'],
   ['U','R','R','D','D','R','U','U','R','D','D','R'],
   ['R','D','D','R','U','U','R','D','D','R','U'],
   ['U','U','R','D','R','D','R','U','U','R','D','D'],
   ['R','R','D','D','L','L','D','R','R','D','L'],
   ['U','U','R','R','U','L','L','U','R','R','D'],
   ['R','D','R','D','R','U','U','R','D','D','R'],
   ['U','R','U','R','D','R','D','R','U','U','R'],
   ['R','R','U','L','U','R','R','D','R','U','R','D'],
   ['U','U','R','R','U','L','L','U','R','R','U','L'],
   ['R','D','D','R','U','R','U','R','D','R','D','R']

  let turn=0;while(route.length<targetLength){const preference=n%3===0?['U','R','D','L']:n%3===1?['D','L','U','R']:['L','U','R','D'];const options=preference.filter(d=>allowedDirs.includes(d)&&(()=>{let nr=r+V[d].dr,nc=c+V[d].dc;if(wrap){nr=(nr+rows)%rows;nc=(nc+cols)%cols}return nr>=0&&nc>=0&&nr<rows&&nc<cols&&!coords.some(q=>q[0]===nr&&q[1]===nc)})());if(!options.length)break;add(options[turn++%options.length])}

  for(let i=0;i<count;i++)tileColors[coords[i][0]+','+coords[i][1]]=DIR_COLOR[walk[i]];tileColors[goal[0]+','+goal[1]]=GOAL_COLOR;

  return{rows,cols,start,goal,walk,seen:new Set(coords.slice(0,count+1).map(q=>q[0]+','+q[1])),walls:new Set(),wrap,conditional:true,conditionDirs,mode:n<15?'repeat':n%2===0?'repeat':'while',tileColors,chapter:n<15?'PRIMEIROS CONDICIONAIS':n<20?'NOVAS CONDIÇÕES':n<30?'CICLOS E DESVIOS':n<40?'DESAFIO DE LÓGICA':'MESTRE DOS ALGORITMOS'}
 }
 let r=start[0],c=start[1],walk=[],seen=new Set([r+','+c]),guard=0;while(walk.length<classicLength&&guard++<rows*cols*8){let a=wrap?['U','D','L','R']:[];if(!wrap){if(r>0)a.push('U');if(r<rows-1)a.push('D');if(c>0)a.push('L');if(c<cols-1)a.push('R')}const fresh=a.filter(k=>{let nr=r+V[k].dr,nc=c+V[k].dc;if(wrap){nr=(nr+rows)%rows;nc=(nc+cols)%cols}return !seen.has(nr+','+nc)});if(fresh.length)a=fresh;const d=a[Math.floor(rand()*a.length)];r+=V[d].dr;c+=V[d].dc;if(wrap){r=(r+rows)%rows;c=(c+cols)%cols}walk.push(d);seen.add(r+','+c)}
 const goal=[r,c],walls=new Set(),tileColors={};for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const k=y+','+x;if(!seen.has(k)&&rand()<.35)walls.add(k)}
 const accentCount=n<=3?0:n<=6?1:2,palette=['#2fc3ce','#b3d431'].slice(0,accentCount),eligible=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const k=y+','+x;if(!seen.has(k)&&!walls.has(k))eligible.push(k)}if(palette.length)for(const k of eligible)if(rand()<(n<=6?.18:.3))tileColors[k]=palette[Math.floor(rand()*palette.length)];
 return{rows,cols,start,goal,walk,seen,walls,wrap,tileColors,chapter:n<=10?'PRIMEIROS PASSOS':n<=20?'NOVAS DIREÇÕES':n<=30?'CICLOS E DESVIOS':n<=40?'DESAFIO DE LÓGICA':'MESTRE DOS ALGORITMOS'}
}
function rulesCode(l){const order=l.conditionDirs||['R','L','U','D'];return order.map((d,i)=>'<br><span class="fn">'+(i===0?'se':i<order.length-1?'senão se':'senão')+'</span> '+(i<order.length-1?'<i class="swatch" style="background:'+DIR_COLOR[d]+'" aria-label="cor da condição"></i> ':'')+'<span class="brace">{</span><br>&nbsp;&nbsp;<span class="fn">'+V[d].label+'()</span><br><span class="brace">}</span>').join('')}
function code(l){if(l.conditional){if(l.mode==='while')return'<span class="brace">{</span><br><span class="fn">enquanto</span> <span class="fn">não chegada</span> <span class="brace">{</span>'+rulesCode(l)+'<br><span class="brace">}</span><br><span class="brace">}</span>';return'<span class="brace">{</span><br><span class="fn">repetir</span> (<span class="num">'+l.walk.length+'</span>) <span class="brace">{</span>'+rulesCode(l)+'<br><span class="brace">}</span><br><span class="brace">}</span>'}let a=[];for(let d of l.walk){let z=a[a.length-1];if(z&&z.d===d)z.n++;else a.push({d,n:1})}let out='<span class="brace">{</span>';for(let z of a)out+=z.n>1?'<br><span class="fn">repetir</span> (<span class="num">'+z.n+'</span>) <span class="brace">{</span><br>&nbsp;&nbsp;<span class="fn">'+V[z.d].label+'()</span><br><span class="brace">}</span>':'<br><span class="fn">'+V[z.d].label+'()</span>';return out+'<br><span class="brace">}</span>'}const levels=Array.from({length:TOTAL},(_,i)=>makeLevel(i+1));let unlocked=1,done=new Set(),level=1,step=0,pos=null,solved=false,moving=false;try{let s=JSON.parse(localStorage.getItem('trilha-logica-save')||'{}');unlocked=Math.max(1,Math.min(TOTAL,s.unlocked||1));done=new Set(Array.isArray(s.completed)?s.completed:[])}catch{}function save(){try{localStorage.setItem('trilha-logica-save',JSON.stringify({unlocked,completed:[...done]}))}catch{}}function cur(){return levels[level-1]}function title(n){return n===1?'Primeiro passo':n===50?'Desafio final':['Novos caminhos','Vire e descubra','Siga as setas','Um ciclo de cada vez','Rota surpresa','Mais uma curva','Leia com atenção','Passos em sequência','Desvio azul','Pense antes de clicar'][(n-2)%10]}
function draw(){let l=cur(),g=$('#grid');g.style.setProperty('--cols',l.cols);g.classList.toggle('wrap-level',l.wrap);g.innerHTML='';for(let y=0;y<l.rows;y++)for(let x=0;x<l.cols;x++){let k=y+','+x,b=document.createElement('div');b.className='cell '+(l.walls.has(k)?'wall':'path');if(l.tileColors&&l.tileColors[k])b.style.backgroundColor=l.tileColors[k];b.setAttribute('role','gridcell');b.setAttribute('aria-label',`linha ${y+1}, coluna ${x+1}${l.walls.has(k)?', bloqueio':', caminho'}`);if(y===l.start[0]&&x===l.start[1])b.classList.add('start');if(solved&&y===l.goal[0]&&x===l.goal[1])b.classList.add('correct');g.appendChild(b)}}
function map(){let box=$('#levels');box.innerHTML='';for(let i=1;i<=TOTAL;i++){let b=document.createElement('button');b.className='lv'+(i<=unlocked?' open':'')+(done.has(i)?' done':'')+(i===level?' current':'');b.textContent=i<=unlocked?i:'🔒';b.disabled=i>unlocked;b.title=i<=unlocked?`Fase ${i}`:'Complete as anteriores para desbloquear';b.onclick=()=>load(i);box.appendChild(b)}}function fitCode(){const el=$('#code'),box=el.parentElement;let size=Math.min(42,Math.max(15,window.innerWidth*.034));el.style.fontSize=size+'px';el.style.lineHeight='1.4';while(el.scrollHeight>box.clientHeight&&size>11){size-=1;el.style.fontSize=size+'px'}}function update(){let l=cur();$('#chapter').textContent=l.chapter;$('#levelTitle').textContent=`Fase ${level}`;$('#progressLabel').textContent=`${level} / ${TOTAL}`;$('#headerProgress').textContent=`Fase ${level} / ${TOTAL}`;$('#progressBar').style.width=`${done.size/TOTAL*100}%`;$('#code').innerHTML=code(l);fitCode();$('#nextBtn').disabled=!solved||level>=TOTAL;$('#counter').textContent=solved?'✔':`${step} de ${l.walk.length} passos`;map()}
function showCursorAtStart(){alignCursor(true)}function alignCursor(instant=false){const l=cur(),cell=document.querySelectorAll("#grid .cell")[pos[0]*l.cols+pos[1]],r=cell.getBoundingClientRect(),dot=document.getElementById("cursor"),old=dot.style.transition;if(instant)dot.style.transition="none";dot.style.left=(r.left+window.scrollX+(r.width-dot.offsetWidth)/2)+"px";dot.style.top=(r.top+window.scrollY+(r.height-dot.offsetHeight)/2)+"px";dot.style.opacity="1";if(instant){void dot.offsetWidth;dot.style.transition=old||"left .19s cubic-bezier(.2,.75,.25,1),top .19s cubic-bezier(.2,.75,.25,1),opacity .12s"}}function load(n){if(n>unlocked)return;level=n;step=0;pos=[...cur().start];solved=false;$('#modal').classList.remove('show');$('#description').textContent='';$('#status').textContent='';$('#status').style.color='';draw();update();showCursorAtStart()}
function restart(){if(moving)return;step=0;pos=[...cur().start];solved=false;draw();update();showCursorAtStart();$('#status').textContent='↺ Início';$('#status').style.color='#bb5965'}
function finishStep(d){if(step===cur().walk.length){solved=true;done.add(level);unlocked=Math.max(unlocked,Math.min(TOTAL,level+1));save();draw();update();$('#status').textContent='';setTimeout(()=>{const layout=document.querySelector('.layout');if(level<TOTAL){layout.classList.add('transition-out');setTimeout(()=>{load(level+1);requestAnimationFrame(()=>{layout.classList.remove('transition-out');layout.classList.add('phase-enter');setTimeout(()=>layout.classList.remove('phase-enter'),190);requestAnimationFrame(()=>alignCursor(true))})},170)}else{$('#status').textContent='✔'}},500)}else{$('#counter').textContent=step+' de '+cur().walk.length+' passos';$('#status').textContent='✔';$('#status').style.color='var(--blue)'}}function move(key){if(solved||moving)return;let d={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[key];if(!d)return;const l=cur(),cellColor=l.tileColors&&l.tileColors[pos[0]+','+pos[1]],expected=l.conditional?DIR_FROM_COLOR[cellColor]:l.walk[step];if(d!==expected){restart();return}const from=[...pos],to=l.wrap?[(pos[0]+V[d].dr+l.rows)%l.rows,(pos[1]+V[d].dc+l.cols)%l.cols]:[pos[0]+V[d].dr,pos[1]+V[d].dc],crossed=l.wrap&&((d==='L'&&from[1]===0)||(d==='R'&&from[1]===l.cols-1)||(d==='U'&&from[0]===0)||(d==='D'&&from[0]===l.rows-1));step++;if(crossed){moving=true;const dot=document.getElementById('cursor');dot.style.opacity='0';setTimeout(()=>{pos=to;draw();alignCursor(true);dot.style.opacity='0';requestAnimationFrame(()=>{dot.style.opacity='1';moving=false;finishStep(d)})},110)}else{pos=to;draw();alignCursor(false);finishStep(d)}}function next(){if(level<TOTAL&&solved)load(level+1);else if(level===TOTAL&&solved){done.clear();unlocked=1;save();load(1)}}$('#resetBtn').onclick=()=>{if(moving)return;step=0;pos=[...cur().start];solved=false;draw();update();showCursorAtStart();$('#status').textContent='Use as setas.'};$('#nextBtn').onclick=next;$('#modalBtn').onclick=()=>{$('#modal').classList.remove('show');next()};$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('show')};document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();move(e.key)}if(e.key==='Escape')$('#modal').classList.remove('show')});window.addEventListener('resize',()=>{const dot=document.getElementById('cursor');if(dot&&dot.style.opacity==='1')alignCursor(true);fitCode()});document.querySelectorAll('.pad').forEach(b=>b.addEventListener('click',()=>move(b.dataset.key)));load(level)
})();
